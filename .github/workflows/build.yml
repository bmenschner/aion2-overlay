name: Windows build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build Aion2Overlay.slnx --configuration Release
      - run: dotnet test tests/Aion2Overlay.Core.Tests/Aion2Overlay.Core.Tests.csproj --configuration Release --no-build
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/Test-OverlayLauncher.ps1
